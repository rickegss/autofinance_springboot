<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/date-fns@2.30.0/index.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: { fontFamily: { poppins: ['Poppins', 'sans-serif'] } }
        }
    }
  </script>
  <style>
    body { opacity: 0; transition: opacity 0.3s ease; }
    body.loaded { opacity: 1; }
    .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-radius: 12px;
        font-size: 0.9rem;
        font-weight: 500;
        color: #64748b;
        transition: all 0.2s ease;
        text-decoration: none;
    }
    .nav-item:hover {
        background-color: #f0f2f8;
        color: #1a1aff;
    }
    .nav-item.active {
        background-color: #1a1aff;
        color: white;
    }
    .nav-item.active svg { stroke: white; }
    .dark .nav-item:hover {
        background-color: #334155;
        color: #60a5fa;
    }
    .dark .nav-item.active {
        background-color: #2563eb;
    }
    /* Calendário compacto */
    .calendar-day {
        aspect-ratio: 1 / 1;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
        font-weight: 500;
    }
    .calendar-day.has-transaction {
        background-color: #fef3c7;
        font-weight: bold;
        color: #b45309;
    }
    .dark .calendar-day.has-transaction {
        background-color: #451a03;
        color: #fde68a;
    }
    .calendar-day.closing-day {
        border: 2px solid #10b981;
        background-color: #d1fae5;
    }
    .dark .calendar-day.closing-day {
        border-color: #34d399;
        background-color: #064e3b;
        color: #a7f3d0;
    }
  </style>
  <title>Autofinance - Calendário</title>
</head>
<body class="font-poppins bg-[#f0f2f8] dark:bg-gray-900 min-h-screen flex">

<aside class="w-[240px] bg-white dark:bg-gray-800 min-h-screen flex flex-col px-5 py-6 shadow-[2px_0_12px_rgba(0,0,0,0.06)] dark:shadow-none flex-shrink-0">
  <div class="flex items-center gap-2 mb-10 px-2">
    <h1 class="text-[1.3rem] font-bold text-[#1a1aff] dark:text-blue-400">Autofinance</h1>
    <svg class="w-6 h-6 text-[#1a1aff] dark:text-blue-400" viewBox="0 0 38 38" fill="none">
      <polygon points="19,2 35,11 35,27 19,36 3,27 3,11" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <line x1="19" y1="2" x2="19" y2="36" stroke="currentColor" stroke-width="1.5"/>
      <line x1="3" y1="11" x2="35" y2="27" stroke="currentColor" stroke-width="1.5"/>
      <line x1="35" y1="11" x2="3" y2="27" stroke="currentColor" stroke-width="1.5"/>
    </svg>
  </div>
  <nav class="flex flex-col gap-1 flex-1">
    <a href="/dashboard" class="nav-item"><i data-lucide="home" class="w-4 h-4"></i><span>Início</span></a>
    <a href="/transactions" class="nav-item"><i data-lucide="arrow-left-right" class="w-4 h-4"></i><span>Lançamentos</span></a>
    <a href="/goals" class="nav-item"><i data-lucide="target" class="w-4 h-4"></i><span>Metas</span></a>
    <a href="/reports" class="nav-item"><i data-lucide="bar-chart-2" class="w-4 h-4"></i><span>Relatórios</span></a>
    <a href="/calendar" class="nav-item active"><i data-lucide="calendar-days" class="w-4 h-4"></i><span>Calendário</span></a>
    <a href="/settings" class="nav-item"><i data-lucide="settings" class="w-4 h-4"></i><span>Configurações</span></a>
  </nav>
  <div class="mt-auto pt-4 border-t border-[#f0f2f8] dark:border-gray-700">
    <a href="/profile" class="flex items-center gap-3 px-2 py-3 rounded-xl hover:bg-[#f0f2f8] dark:hover:bg-gray-700 transition-colors mb-2 no-underline">
      <div class="w-9 h-9 rounded-full bg-[#1a1aff] dark:bg-blue-600 flex items-center justify-center text-white font-bold text-sm flex-shrink-0" id="userAvatar">U</div>
      <div class="flex flex-col min-w-0">
        <span class="text-[0.8rem] font-semibold text-[#1a1a2e] dark:text-gray-200 truncate" id="userName">Carregando...</span>
        <span class="text-[0.72rem] text-[#666] dark:text-gray-400">Ver perfil</span>
      </div>
      <i data-lucide="chevron-right" class="w-4 h-4 text-[#aaa] dark:text-gray-500 ml-auto flex-shrink-0"></i>
    </a>
  </div>
</aside>

<main class="flex-1 p-8 overflow-y-auto">
  <div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h2 class="text-2xl font-bold text-[#1a1a2e] dark:text-white">Calendário Financeiro</h2>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Acompanhe transações por dia e veja seu fechamento mensal</p>
      </div>
      <div class="flex gap-2">
        <button id="prevMonth" class="p-2 rounded-lg bg-white dark:bg-gray-800 shadow hover:shadow-md"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
        <span id="monthYear" class="text-lg font-semibold dark:text-white px-4 py-2 bg-white dark:bg-gray-800 rounded-lg shadow">Carregando...</span>
        <button id="nextMonth" class="p-2 rounded-lg bg-white dark:bg-gray-800 shadow hover:shadow-md"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
      </div>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm p-4 mb-6">
      <div class="grid grid-cols-7 gap-1 text-center font-semibold text-gray-600 dark:text-gray-300 mb-2 text-sm">
        <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
      </div>
      <div id="calendarGrid" class="grid grid-cols-7 gap-1"></div>
    </div>

    <!-- Resumo: fechamento do mês + transações recorrentes -->
    <div id="summaryBox" class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm p-4">
      <h3 class="text-md font-semibold text-gray-800 dark:text-white mb-2">📌 Resumo do mês</h3>
      <div id="summaryContent" class="text-sm text-gray-600 dark:text-gray-300 space-y-1"></div>
    </div>

    <div id="selectedDayInfo" class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm p-6 mt-6 hidden">
      <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-3">Transações do dia <span id="selectedDate"></span></h3>
      <div id="dayTransactionsList" class="space-y-2 max-h-60 overflow-y-auto"></div>
    </div>
  </div>
</main>

<script th:src="@{/js/theme.js}"></script>
<script th:src="@{/js/transitions.js}"></script>
<script th:inline="javascript">
  lucide.createIcons();

  const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
  const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
  const formatter = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });

  let currentDate = new Date();
  let allTransactions = [];
  let allRecurringTemplates = []; // transações recorrentes (templates)
  let userFinancialDay = 1;

  async function loadUserData() {
      try {
          const res = await fetch('/api/user/me', { headers: { [csrfHeader]: csrfToken } });
          if (res.ok) {
              const user = await res.json();
              const avatarDiv = document.getElementById('userAvatar');
              if (user.avatarBase64) {
                  avatarDiv.style.backgroundImage = `url(data:image/jpeg;base64,${user.avatarBase64})`;
                  avatarDiv.style.backgroundSize = 'cover';
                  avatarDiv.textContent = '';
              } else {
                  avatarDiv.textContent = (user.name ? user.name.charAt(0) : user.email.charAt(0)).toUpperCase();
                  avatarDiv.style.backgroundImage = '';
              }
              document.getElementById('userName').textContent = user.name || user.email;
              userFinancialDay = user.financialMonthDay || 1;
          }
      } catch (e) { console.warn(e); }
  }

  async function loadTransactions() {
      try {
          const res = await fetch('/api/transactions', { headers: { [csrfHeader]: csrfToken } });
          if (!res.ok) throw new Error();
          const all = await res.json();
          // Separa as transações recorrentes (templates) das normais
          allTransactions = all.filter(t => !t.recurring);
          allRecurringTemplates = all.filter(t => t.recurring === true);
      } catch (e) { console.error(e); }
  }

  function getTransactionsForDate(date) {
      const year = date.getFullYear();
      const month = date.getMonth();
      const day = date.getDate();
      return allTransactions.filter(t => {
          const d = new Date(t.date);
          return d.getFullYear() === year && d.getMonth() === month && d.getDate() === day;
      });
  }

  // Retorna as transações recorrentes que aconteceriam no mês atual (baseado no recurringDay)
  function getRecurringForMonth(year, month) {
      const recurringThisMonth = [];
      const lastDayOfMonth = new Date(year, month + 1, 0).getDate();
      allRecurringTemplates.forEach(tx => {
          let day = tx.recurringDay;
          if (!day) return;
          // Ajusta se o dia for maior que o último dia do mês (ex: 31 em fevereiro)
          if (day > lastDayOfMonth) day = lastDayOfMonth;
          const dateObj = new Date(year, month, day);
          // Verifica se não expirou
          if (tx.recurringEndDate) {
              const endDate = new Date(tx.recurringEndDate);
              if (dateObj > endDate) return;
          }
          recurringThisMonth.push({
              day: day,
              description: tx.description || 'Sem descrição',
              amount: tx.amount,
              category: tx.category,
              dateObj: dateObj
          });
      });
      return recurringThisMonth;
  }

  function updateSummary() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
      const monthName = monthNames[month];

      // 1. Fechamento do mês
      let closingDay = userFinancialDay;
      const lastDayOfMonth = new Date(year, month + 1, 0).getDate();
      if (closingDay > lastDayOfMonth) closingDay = lastDayOfMonth;
      const closingDateFormatted = `${closingDay.toString().padStart(2,'0')}/${(month+1).toString().padStart(2,'0')}`;
      let html = `<p>📅 <span class="font-semibold">${closingDateFormatted}:</span> Fechamento do mês (${monthName})</p>`;

      // 2. Transações recorrentes do mês
      const recurring = getRecurringForMonth(year, month);
      if (recurring.length > 0) {
          html += `<p class="mt-2 font-semibold">🔄 Transações recorrentes previstas:</p><ul class="list-disc pl-5 space-y-1">`;
          recurring.forEach(rec => {
              const dayStr = rec.day.toString().padStart(2,'0');
              const dateLabel = `${dayStr}/${(month+1).toString().padStart(2,'0')}`;
              html += `<li>📌 <span class="font-medium">${dateLabel}:</span> ${escapeHtml(rec.description)} — ${formatter.format(rec.amount)}</li>`;
          });
          html += `</ul>`;
      } else {
          html += `<p class="mt-2 text-gray-500 dark:text-gray-400">Nenhuma transação recorrente para este mês.</p>`;
      }
      document.getElementById('summaryContent').innerHTML = html;
  }

  function buildCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDayOfMonth = new Date(year, month, 1);
      const lastDayOfMonth = new Date(year, month + 1, 0);
      const startDayOfWeek = firstDayOfMonth.getDay(); // 0 = domingo
      const daysInMonth = lastDayOfMonth.getDate();

      const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
      document.getElementById('monthYear').textContent = `${monthNames[month]} ${year}`;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      for (let i = 0; i < startDayOfWeek; i++) {
          const emptyDiv = document.createElement('div');
          emptyDiv.className = 'calendar-day p-1 text-center text-gray-400 dark:text-gray-600';
          emptyDiv.textContent = '';
          grid.appendChild(emptyDiv);
      }

      for (let d = 1; d <= daysInMonth; d++) {
          const dateObj = new Date(year, month, d);
          const hasTransaction = getTransactionsForDate(dateObj).length > 0;
          const isClosingDay = (d === userFinancialDay) || (d === lastDayOfMonth && userFinancialDay > lastDayOfMonth);
          const dayDiv = document.createElement('div');
          dayDiv.className = `calendar-day p-1 text-center rounded-lg cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 ${hasTransaction ? 'has-transaction' : ''} ${isClosingDay ? 'closing-day' : ''}`;
          dayDiv.textContent = d;
          dayDiv.addEventListener('click', () => showDayDetails(dateObj));
          grid.appendChild(dayDiv);
      }

      // Atualiza o resumo abaixo do calendário
      updateSummary();
  }

  function showDayDetails(date) {
      const transactions = getTransactionsForDate(date);
      const formattedDate = date.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      document.getElementById('selectedDate').innerHTML = formattedDate.replace(/^./, l => l.toUpperCase());
      const listDiv = document.getElementById('dayTransactionsList');
      if (transactions.length === 0) {
          listDiv.innerHTML = '<p class="text-gray-500 dark:text-gray-400">Nenhuma transação neste dia.</p>';
      } else {
          let html = '<div class="space-y-2">';
          transactions.forEach(tx => {
              const amountClass = tx.type === 'RECEITA' ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400';
              html += `
                  <div class="p-3 border border-gray-200 dark:border-gray-700 rounded-lg flex justify-between items-center">
                      <div>
                          <p class="font-semibold dark:text-white">${escapeHtml(tx.description || 'Sem descrição')}</p>
                          <p class="text-sm text-gray-500 dark:text-gray-400">${escapeHtml(tx.category)}</p>
                      </div>
                      <p class="${amountClass} font-bold">${formatter.format(tx.amount)}</p>
                  </div>
              `;
          });
          html += '</div>';
          listDiv.innerHTML = html;
      }
      document.getElementById('selectedDayInfo').classList.remove('hidden');
  }

  function escapeHtml(str) { return str?.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]) || ''; }

  document.getElementById('prevMonth').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() - 1); buildCalendar(); });
  document.getElementById('nextMonth').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() + 1); buildCalendar(); });

  (async () => {
      await loadUserData();
      await loadTransactions();
      buildCalendar();
      lucide.createIcons();
  })();
</script>
</body>
</html>
