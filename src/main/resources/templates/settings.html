<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { poppins: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { opacity: 0; transition: opacity 0.3s ease; }
        body.loaded { opacity: 1; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #64748b;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .nav-item:hover {
            background-color: #f0f2f8;
            color: #1a1aff;
        }
        .nav-item.active {
            background-color: #1a1aff;
            color: white;
        }
        .nav-item.active svg {
            stroke: white;
        }
        /* Ajustes para dark mode nos ícones da sidebar */
        .dark .nav-item:hover {
            background-color: #334155;
        }
        .dark .nav-item.active {
            background-color: #1e40af;
        }
    </style>
    <title>Autofinance - Configurações</title>
</head>
<body class="font-poppins bg-[#f0f2f8] dark:bg-gray-900 min-h-screen flex">

<!-- Sidebar igual ao dashboard -->
<aside class="w-[240px] bg-white dark:bg-gray-800 min-h-screen flex flex-col px-5 py-6 shadow-[2px_0_12px_rgba(0,0,0,0.06)] flex-shrink-0">
    <div class="flex items-center gap-2 mb-10 px-2">
        <h1 class="text-[1.3rem] font-bold text-[#1a1aff] dark:text-blue-400">Autofinance</h1>
        <svg class="w-6 h-6 text-[#1a1aff] dark:text-blue-400" viewBox="0 0 38 38" fill="none">
            <polygon points="19,2 35,11 35,27 19,36 3,27 3,11" fill="none" stroke="currentColor" stroke-width="2.5"/>
            <line x1="19" y1="2" x2="19" y2="36" stroke="currentColor" stroke-width="1.5"/>
            <line x1="3" y1="11" x2="35" y2="27" stroke="currentColor" stroke-width="1.5"/>
            <line x1="35" y1="11" x2="3" y2="27" stroke="currentColor" stroke-width="1.5"/>
        </svg>
    </div>

    <nav class="flex flex-col gap-1 flex-1">
        <a href="/dashboard" class="nav-item">
            <i data-lucide="home" class="w-4 h-4"></i>
            <span>Painel</span>
        </a>
        <a href="/transactions" class="nav-item">
            <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
            <span>Lançamentos</span>
        </a>
        <a href="/goals" class="nav-item">
            <i data-lucide="target" class="w-4 h-4"></i>
            <span>Metas</span>
        </a>
        <a href="#" class="nav-item">
            <i data-lucide="bar-chart-2" class="w-4 h-4"></i>
            <span>Relatórios</span>
        </a>
        <a href="#" class="nav-item"><i data-lucide="calendar-days" class="w-4 h-4"></i><span>Calendário</span></a>
        <a href="/settings" class="nav-item active">
            <i data-lucide="settings" class="w-4 h-4"></i>
            <span>Configurações</span>
        </a>
    </nav>

    <div class="mt-auto pt-4 border-t border-[#f0f2f8] dark:border-gray-700">
        <a href="/profile" class="flex items-center gap-3 px-2 py-3 rounded-xl hover:bg-[#f0f2f8] dark:hover:bg-gray-700 transition-colors mb-2 no-underline">
            <div class="w-9 h-9 rounded-full bg-[#1a1aff] flex items-center justify-center text-white font-bold text-sm flex-shrink-0" id="userAvatar">U</div>
            <div class="flex flex-col min-w-0">
                <span class="text-[0.8rem] font-semibold text-[#1a1a2e] dark:text-gray-200 truncate" id="userName">Carregando...</span>
                <span class="text-[0.72rem] text-[#666] dark:text-gray-400">Ver perfil</span>
            </div>
            <i data-lucide="chevron-right" class="w-4 h-4 text-[#aaa] ml-auto flex-shrink-0"></i>
        </a>
    </div>
</aside>

<!-- Conteúdo principal -->
<main class="flex-1 p-8 overflow-y-auto">
    <div class="max-w-3xl mx-auto">
        <h2 class="text-2xl font-bold text-[#1a1a2e] dark:text-white mb-6">Configurações</h2>

        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm p-6 mb-8">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">Aparência</h3>

            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <i data-lucide="moon" class="w-5 h-5 text-gray-700 dark:text-gray-300"></i>
                    <span class="text-gray-700 dark:text-gray-300 font-medium">Modo escuro</span>
                </div>

                <!-- Toggle switch -->
                <div id="themeToggle" class="relative inline-flex items-center cursor-pointer" onclick="toggleTheme()">
                    <div class="w-11 h-6 bg-gray-200 dark:bg-blue-600 rounded-full transition-colors duration-200"></div>
                    <div class="absolute left-0.5 top-0.5 w-5 h-5 bg-white rounded-full shadow transform transition-transform duration-200 dark:translate-x-5"></div>
                </div>
            </div>

            <p class="text-sm text-gray-500 dark:text-gray-400 mt-4">
                O tema é salvo no seu perfil e sincronizado entre todos os seus dispositivos.
            </p>
        </div>

        <!-- Outras configurações futuras podem ser adicionadas aqui -->
    </div>
</main>

<!-- Scripts: primeiro theme.js, depois transições e dados do usuário -->
<script th:src="@{/js/theme.js}"></script>
<script th:src="@{/js/transitions.js}"></script>
<script th:inline="javascript">
    lucide.createIcons();

    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

    async function loadUserData() {
        try {
            const res = await fetch('/api/user/me', { headers: { [csrfHeader]: csrfToken } });
            if (res.ok) {
                const user = await res.json();
                const avatarDiv = document.getElementById('userAvatar');
                if (user.avatarBase64) {
                    avatarDiv.style.backgroundImage = `url(data:image/jpeg;base64,${user.avatarBase64})`;
                    avatarDiv.style.backgroundSize = 'cover';
                    avatarDiv.textContent = '';
                } else {
                    avatarDiv.textContent = (user.name ? user.name.charAt(0) : user.email.charAt(0)).toUpperCase();
                    avatarDiv.style.backgroundImage = '';
                }
                document.getElementById('userName').textContent = user.name || user.email;
            }
        } catch (e) {
            console.warn('Erro ao carregar usuário:', e);
        }
    }

    loadUserData();
</script>
</body>
</html>
