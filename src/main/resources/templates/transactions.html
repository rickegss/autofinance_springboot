<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { poppins: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { opacity: 0; transition: opacity 0.3s ease; }
        body.loaded { opacity: 1; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            color: #64748b;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .nav-item:hover {
            background-color: #f0f2f8;
            color: #1a1aff;
        }
        .nav-item.active {
            background-color: #1a1aff;
            color: white;
        }
        .nav-item.active svg {
            stroke: white;
        }
    </style>
    <title>Autofinance - Lançamentos</title>
</head>
<body class="font-poppins bg-[#f0f2f8] min-h-screen flex">

<aside class="w-[240px] bg-white min-h-screen flex flex-col px-5 py-6 shadow-[2px_0_12px_rgba(0,0,0,0.06)] flex-shrink-0">
    <div class="flex items-center gap-2 mb-10 px-2">
        <h1 class="text-[1.3rem] font-bold text-[#1a1aff]">Autofinance</h1>
        <svg class="w-6 h-6 text-[#1a1aff]" viewBox="0 0 38 38" fill="none">
            <polygon points="19,2 35,11 35,27 19,36 3,27 3,11" fill="none" stroke="currentColor" stroke-width="2.5"/>
            <line x1="19" y1="2" x2="19" y2="36" stroke="currentColor" stroke-width="1.5"/>
            <line x1="3" y1="11" x2="35" y2="27" stroke="currentColor" stroke-width="1.5"/>
            <line x1="35" y1="11" x2="3" y2="27" stroke="currentColor" stroke-width="1.5"/>
        </svg>
    </div>

    <nav class="flex flex-col gap-1 flex-1">
        <a href="/dashboard" class="nav-item">
            <i data-lucide="home" class="w-4 h-4"></i>
            <span>Painel</span>
        </a>
        <a href="/transactions" class="nav-item active">
            <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
            <span>Lançamentos</span>
        </a>
        <a href="#" class="nav-item">
            <i data-lucide="target" class="w-4 h-4"></i>
            <span>Metas</span>
        </a>
        <a href="#" class="nav-item">
            <i data-lucide="bar-chart-2" class="w-4 h-4"></i>
            <span>Relatórios</span>
        </a>
        <a href="#" class="nav-item">
            <i data-lucide="calendar" class="w-4 h-4"></i>
            <span>Planejamento</span>
        </a>
        <a href="#" class="nav-item">
            <i data-lucide="tag" class="w-4 h-4"></i>
            <span>Categorias</span>
        </a>
        <a href="#" class="nav-item">
            <i data-lucide="calendar-days" class="w-4 h-4"></i>
            <span>Calendário</span>
        </a>
        <a href="#" class="nav-item">
            <i data-lucide="settings" class="w-4 h-4"></i>
            <span>Configurações</span>
        </a>
    </nav>

    <div class="mt-auto pt-4 border-t border-[#f0f2f8]">
        <div class="flex items-center gap-3 px-2 py-3 rounded-xl hover:bg-[#f0f2f8] cursor-pointer transition-colors mb-2">
            <div class="w-9 h-9 rounded-full bg-[#1a1aff] flex items-center justify-center text-white font-bold text-sm flex-shrink-0" id="userAvatar">U</div>
            <div class="flex flex-col min-w-0">
                <span class="text-[0.8rem] font-semibold text-[#1a1a2e] truncate" id="userEmailDisplay">usuário</span>
                <span class="text-[0.72rem] text-[#666]">Ver perfil</span>
            </div>
            <i data-lucide="chevron-right" class="w-4 h-4 text-[#aaa] ml-auto flex-shrink-0"></i>
        </div>
    </div>
</aside>

<main class="flex-1 p-8 overflow-y-auto">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h2 class="text-[1.5rem] font-bold text-[#1a1a2e]">Lançamentos</h2>
            <p class="text-[0.85rem] text-[#666] mt-1">Gerencie suas receitas e despesas</p>
        </div>
        <button id="newTransactionBtn" class="bg-[#1a1aff] text-white px-5 py-2 rounded-xl flex items-center gap-2 hover:bg-[#0f0fcc] transition">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>Novo lançamento</span>
        </button>
    </div>

    <div id="messageDiv" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

    <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Descrição</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Valor</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Tipo</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Categoria</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Data</th>
                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Ações</th>
            </tr>
            </thead>
            <tbody id="transactionsTableBody" class="bg-white divide-y divide-gray-200">
            <tr><td colspan="6" class="text-center py-8 text-gray-500">Carregando...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<div id="transactionModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 relative">
        <button id="closeModalBtn" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
            <i data-lucide="x" class="w-5 h-5"></i>
        </button>
        <h3 class="text-xl font-bold text-[#1a1a2e] mb-4">Novo lançamento</h3>
        <form id="transactionForm">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Descrição (opcional)</label>
                <input type="text" id="descriptionInput" class="w-full border border-gray-300 rounded-lg px-4 py-2">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Valor *</label>
                <input type="number" id="amountInput" step="0.01" required class="w-full border border-gray-300 rounded-lg px-4 py-2">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Tipo *</label>
                <select id="typeSelect" required class="w-full border border-gray-300 rounded-lg px-4 py-2">
                    <option value="DESPESA">Despesa</option>
                    <option value="RECEITA">Receita</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Categoria *</label>
                <select id="categorySelect" required class="w-full border border-gray-300 rounded-lg px-4 py-2"></select>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Data *</label>
                <input type="date" id="dateInput" required class="w-full border border-gray-300 rounded-lg px-4 py-2">
            </div>
            <div class="mb-4">
                <label class="flex items-center gap-2">
                    <input type="checkbox" id="recurringCheckbox" class="rounded border-gray-300">
                    <span class="text-sm text-gray-700">Transação recorrente</span>
                </label>
            </div>
            <div id="recurringDayContainer" class="mb-4 hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1">Dia do mês (1-31) *</label>
                <input type="number" id="recurringDayInput" min="1" max="31" class="w-full border border-gray-300 rounded-lg px-4 py-2">
            </div>
            <div class="flex justify-end gap-2">
                <button type="button" id="cancelModalBtn" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">Cancelar</button>
                <button type="submit" class="px-4 py-2 bg-[#1a1aff] text-white rounded-lg hover:bg-[#0f0fcc]">Salvar</button>
            </div>
        </form>
    </div>
</div>

<script th:inline="javascript">
    lucide.createIcons();

    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
    const tbody = document.getElementById('transactionsTableBody');
    const modal = document.getElementById('transactionModal');
    const form = document.getElementById('transactionForm');
    const messageDiv = document.getElementById('messageDiv');

    // Elementos da recorrência
    const recurringCheckbox = document.getElementById('recurringCheckbox');
    const recurringDayContainer = document.getElementById('recurringDayContainer');
    const recurringDayInput = document.getElementById('recurringDayInput');

    // Lista de categorias
    const categories = [
        "Aluguel","Energia","Água","Gás","Internet","Transporte","Alimentação","Saúde","Educação","Lazer",
        "Assinaturas","Compras","Moda","Pet","Hobby","Casa","Viagem","Presentes","Investimentos","Empréstimos",
        "Seguro","Impostos","Poupança","Outros"
    ];

    // Preencher select de categorias
    const categorySelect = document.getElementById('categorySelect');
    categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        categorySelect.appendChild(option);
    });

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('dateInput').value = today;

    const currencyFormatter = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });

    // Função utilitária
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function showMessage(text, type) {
        messageDiv.textContent = text;
        messageDiv.className = `mb-4 p-3 rounded-lg text-sm ${type === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`;
        messageDiv.classList.remove('hidden');
        setTimeout(() => messageDiv.classList.add('hidden'), 4000);
    }

    // Controle do checkbox de recorrência
    recurringCheckbox.addEventListener('change', () => {
        if (recurringCheckbox.checked) {
            recurringDayContainer.classList.remove('hidden');
        } else {
            recurringDayContainer.classList.add('hidden');
            recurringDayInput.value = '';
        }
    });

    function attachDeleteEvents() {
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.removeEventListener('click', deleteHandler);
            btn.addEventListener('click', deleteHandler);
        });
    }

    function deleteHandler(e) {
        const id = e.currentTarget.getAttribute('data-id');
        if (confirm('Tem certeza que deseja excluir este lançamento?')) {
            deleteTransaction(id);
        }
    }

    function deleteTransaction(id) {
        fetch(`/api/transactions/${id}`, {
            method: 'DELETE',
            headers: { [csrfHeader]: csrfToken }
        })
        .then(res => {
            if (res.ok) {
                showMessage('Lançamento excluído com sucesso!', 'success');
                loadTransactions();
            } else {
                showMessage('Falha ao excluir lançamento', 'error');
            }
        })
        .catch(() => showMessage('Erro de conexão', 'error'));
    }

    function loadTransactions() {
        fetch('/api/transactions', {
            headers: { [csrfHeader]: csrfToken }
        })
        .then(res => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        })
        .then(transactions => {
            if (!transactions.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-gray-500">Nenhum lançamento encontrado.</td></tr>';
                return;
            }
            let html = '';
            transactions.forEach(t => {
                const amountClass = t.type === 'RECEITA' ? 'text-green-600' : 'text-red-600';
                const typeIcon = t.type === 'RECEITA' ? 'trending-up' : 'trending-down';
                const recurringBadge = t.recurring ? ' <span class="ml-2 text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded">Recorrente</span>' : '';
                html += `
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${escapeHtml(t.description || '-')} ${recurringBadge}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold ${amountClass}">${currencyFormatter.format(t.amount)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm">
                            <div class="flex items-center gap-1"><i data-lucide="${typeIcon}" class="w-4 h-4"></i>${t.type === 'RECEITA' ? 'Receita' : 'Despesa'}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm">${escapeHtml(t.category)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm">${new Date(t.date).toLocaleDateString('pt-BR')}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right">
                            <button class="delete-btn text-red-600 hover:text-red-800" data-id="${t.id}">
                                <i data-lucide="trash-2" class="w-5 h-5"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
            lucide.createIcons();
            attachDeleteEvents();
        })
        .catch(err => {
            console.error('Erro ao carregar lançamentos:', err);
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-red-500">Falha ao carregar lançamentos.</td></tr>';
            showMessage('Erro ao carregar lançamentos', 'error');
        });
    }

    // Abrir modal
    document.getElementById('newTransactionBtn').onclick = () => {
        modal.classList.remove('hidden');
        form.reset();
        document.getElementById('dateInput').value = today;
        recurringCheckbox.checked = false;
        recurringDayContainer.classList.add('hidden');
        recurringDayInput.value = '';
    };

    document.getElementById('closeModalBtn').onclick = () => modal.classList.add('hidden');
    document.getElementById('cancelModalBtn').onclick = () => modal.classList.add('hidden');

    // Envio do formulário
    form.onsubmit = (e) => {
        e.preventDefault();

        const description = document.getElementById('descriptionInput').value.trim();
        const amount = parseFloat(document.getElementById('amountInput').value);
        const type = document.getElementById('typeSelect').value;
        const category = document.getElementById('categorySelect').value;
        const date = document.getElementById('dateInput').value;

        if (isNaN(amount) || amount <= 0) {
            showMessage('O valor deve ser maior que zero', 'error');
            return;
        }

        const newTransaction = {
            description,
            amount,
            type,
            category,
            date,
            recurring: recurringCheckbox.checked,
            recurringDay: recurringCheckbox.checked ? parseInt(recurringDayInput.value) : null,
            recurringEndDate: null
        };

        // Validação adicional para recorrência
        if (newTransaction.recurring && (!newTransaction.recurringDay || newTransaction.recurringDay < 1 || newTransaction.recurringDay > 31)) {
            showMessage('Para transações recorrentes, informe um dia do mês válido (1-31)', 'error');
            return;
        }

        fetch('/api/transactions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                [csrfHeader]: csrfToken
            },
            body: JSON.stringify(newTransaction)
        })
        .then(res => {
            if (!res.ok) {
                if (res.status === 400) {
                    return res.json().then(err => { throw new Error(err.message || 'Dados inválidos'); });
                }
                throw new Error('Falha ao salvar lançamento');
            }
            return res.json();
        })
        .then(() => {
            modal.classList.add('hidden');
            showMessage('Lançamento criado com sucesso!', 'success');
            loadTransactions();
        })
        .catch(err => {
            console.error(err);
            showMessage(err.message, 'error');
            modal.classList.add('hidden');
        });
    };

    // Carregar dados do usuário
    fetch('/api/user/me', { headers: { [csrfHeader]: csrfToken } })
        .then(res => res.json())
        .then(user => {
            document.getElementById('userAvatar').textContent = user.email.charAt(0).toUpperCase();
            document.getElementById('userEmailDisplay').textContent = user.email;
        })
        .catch(() => {
            document.getElementById('userAvatar').textContent = 'U';
            document.getElementById('userEmailDisplay').textContent = 'Usuário';
        });

    // Inicializar tabela
    loadTransactions();
</script>
<script th:src="@{/js/transitions.js}"></script>
</body>
</html>
