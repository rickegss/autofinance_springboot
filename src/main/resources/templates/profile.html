<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { fontFamily: { poppins: ['Poppins', 'sans-serif'] } }
            }
        }
    </script>
    <style>
        body { opacity: 0; transition: opacity 0.3s ease; }
        body.loaded { opacity: 1; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            color: #64748b;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .nav-item:hover {
            background-color: #f0f2f8;
            color: #1a1aff;
        }
        .nav-item.active {
            background-color: #1a1aff;
            color: white;
        }
        /* Dark mode overrides */
        .dark .nav-item:hover {
            background-color: #334155;
            color: #60a5fa;
        }
        .dark .nav-item.active {
            background-color: #2563eb;
        }
        img { max-width: 100%; }
        /* Cropper ajustes para dark mode */
        .dark .cropper-view-box,
        .dark .cropper-face {
            background-color: rgba(0,0,0,0.7);
        }
    </style>
    <title>Autofinance - Meu Perfil</title>
</head>
<body class="font-poppins bg-[#f0f2f8] dark:bg-gray-900 min-h-screen flex">

<aside class="w-[240px] bg-white dark:bg-gray-800 min-h-screen flex flex-col px-5 py-6 shadow-[2px_0_12px_rgba(0,0,0,0.06)] dark:shadow-none flex-shrink-0">
    <div class="flex items-center gap-2 mb-10 px-2">
        <h1 class="text-[1.3rem] font-bold text-[#1a1aff] dark:text-blue-400">Autofinance</h1>
        <svg class="w-6 h-6 text-[#1a1aff] dark:text-blue-400" viewBox="0 0 38 38" fill="none">
            <polygon points="19,2 35,11 35,27 19,36 3,27 3,11" fill="none" stroke="currentColor" stroke-width="2.5"/>
            <line x1="19" y1="2" x2="19" y2="36" stroke="currentColor" stroke-width="1.5"/>
            <line x1="3" y1="11" x2="35" y2="27" stroke="currentColor" stroke-width="1.5"/>
            <line x1="35" y1="11" x2="3" y2="27" stroke="currentColor" stroke-width="1.5"/>
        </svg>
    </div>
    <nav class="flex flex-col gap-1 flex-1">
        <a href="/dashboard" class="nav-item"><i data-lucide="home" class="w-4 h-4"></i><span>Painel</span></a>
        <a href="/transactions" class="nav-item"><i data-lucide="arrow-left-right" class="w-4 h-4"></i><span>Lançamentos</span></a>
        <a href="/goals" class="nav-item"><i data-lucide="target" class="w-4 h-4"></i><span>Metas</span></a>
        <a href="/reports" class="nav-item"><i data-lucide="bar-chart-2" class="w-4 h-4"></i><span>Relatórios</span></a>
        <a href="/calendar" class="nav-item"><i data-lucide="calendar-days" class="w-4 h-4"></i><span>Calendário</span></a>
        <a href="/settings" class="nav-item active">
            <i data-lucide="settings" class="w-4 h-4"></i>
            <span>Configurações</span>
        </a>
        <a href="/profile" class="nav-item active"><i data-lucide="user" class="w-4 h-4"></i><span>Perfil</span></a>
    </nav>
    <div class="mt-auto pt-4 border-t border-[#f0f2f8] dark:border-gray-700">
        <div class="flex items-center gap-3 px-2 py-3 rounded-xl hover:bg-[#f0f2f8] dark:hover:bg-gray-700 cursor-pointer transition-colors mb-2">
            <div class="w-9 h-9 rounded-full bg-[#1a1aff] dark:bg-blue-600 flex items-center justify-center text-white font-bold text-sm flex-shrink-0" id="userAvatar">U</div>
            <div class="flex flex-col min-w-0">
                <span class="text-[0.8rem] font-semibold text-[#1a1a2e] dark:text-gray-200 truncate" id="userName">Carregando...</span>
                <span class="text-[0.72rem] text-[#666] dark:text-gray-400">Ver perfil</span>
            </div>
        </div>
    </div>
</aside>

<main class="flex-1 p-8 overflow-y-auto max-w-4xl mx-auto">
    <h2 class="text-2xl font-bold text-[#1a1a2e] dark:text-white mb-6">Meu Perfil</h2>

    <div id="messageDiv" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

    <!-- ========= AVATAR ========= -->
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm p-6 mb-8">
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">Avatar</h3>
        <div class="flex flex-col md:flex-row gap-8">
            <div class="flex flex-col items-center">
                <div class="w-32 h-32 rounded-full bg-gray-200 dark:bg-gray-700 flex items-center justify-center overflow-hidden shadow-md" id="currentAvatarPreview">
                    <span class="text-gray-500 dark:text-gray-400 text-3xl" id="currentAvatarInitial">U</span>
                </div>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-2">Avatar atual</p>
            </div>
            <div class="flex-1">
                <input type="file" id="avatarFile" accept="image/*" class="block text-sm text-gray-500 dark:text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 dark:file:bg-gray-700 file:text-blue-700 dark:file:text-blue-400 hover:file:bg-blue-100 dark:hover:file:bg-gray-600">
                <div class="mt-4">
                    <div class="bg-gray-100 dark:bg-gray-700 rounded-lg p-2" style="max-width: 400px;">
                        <img id="cropperImage" src="" alt="Imagem para cortar" style="display: none; max-width: 100%;">
                    </div>
                    <div class="flex gap-2 mt-3" id="cropperControls" style="display: none;">
                        <button type="button" id="rotateLeftBtn" class="bg-gray-200 dark:bg-gray-600 hover:bg-gray-300 dark:hover:bg-gray-500 px-3 py-1 rounded text-sm dark:text-white">↺ Girar</button>
                        <button type="button" id="zoomOutBtn" class="bg-gray-200 dark:bg-gray-600 hover:bg-gray-300 dark:hover:bg-gray-500 px-3 py-1 rounded text-sm dark:text-white">- Zoom</button>
                        <button type="button" id="zoomInBtn" class="bg-gray-200 dark:bg-gray-600 hover:bg-gray-300 dark:hover:bg-gray-500 px-3 py-1 rounded text-sm dark:text-white">+ Zoom</button>
                        <button type="button" id="cropAndUploadBtn" class="bg-[#1a1aff] dark:bg-blue-600 text-white px-4 py-1 rounded text-sm hover:bg-[#0f0fcc] dark:hover:bg-blue-700 transition">Recortar e enviar</button>
                    </div>
                </div>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-3">Selecione uma imagem, ajuste o recorte e clique em "Recortar e enviar".</p>
            </div>
        </div>
    </div>

    <!-- Dados Pessoais -->
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm p-6 mb-8">
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">Dados pessoais</h3>
        <form id="profileForm" data-spa>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Nome</label>
                <input type="text" id="nameInput" class="w-full border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">E-mail</label>
                <input type="email" id="emailInput" class="w-full border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Objetivo financeiro</label>
                <select id="goalSelect" class="w-full border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-blue-500 focus:border-blue-500">
                    <option value="BALANCED">Organizar os gastos</option>
                    <option value="DEBT_RECOVERY">Sair do vermelho</option>
                    <option value="INVESTMENT">Foco no futuro</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Renda mensal (R$)</label>
                <input type="number" id="incomeInput" step="0.01" class="w-full border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-blue-500 focus:border-blue-500">
            </div>
            <button type="submit" class="bg-[#1a1aff] dark:bg-blue-600 text-white px-5 py-2 rounded-xl hover:bg-[#0f0fcc] dark:hover:bg-blue-700 transition">Salvar alterações</button>
        </form>
    </div>

    <!-- Alterar senha -->
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm p-6">
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">Alterar senha</h3>
        <form id="passwordForm" data-spa>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Senha atual</label>
                <input type="password" id="currentPassword" class="w-full border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Nova senha</label>
                <input type="password" id="newPassword" class="w-full border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Confirmar nova senha</label>
                <input type="password" id="confirmPassword" class="w-full border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-blue-500 focus:border-blue-500">
            </div>
            <button type="submit" class="bg-[#1a1aff] dark:bg-blue-600 text-white px-5 py-2 rounded-xl hover:bg-[#0f0fcc] dark:hover:bg-blue-700 transition">Alterar senha</button>
        </form>
    </div>
</main>

<script th:src="@{/js/theme.js}"></script>
<script th:src="@{/js/transitions.js}"></script>
<script th:inline="javascript">
    lucide.createIcons();

    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
    const messageDiv = document.getElementById('messageDiv');
    let cropper = null;

    function showMessage(text, type) {
        messageDiv.textContent = text;
        messageDiv.className = `mb-4 p-3 rounded-lg text-sm ${type === 'success' ? 'bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200' : 'bg-red-100 dark:bg-red-900 text-red-800 dark:text-red-200'}`;
        messageDiv.classList.remove('hidden');
        setTimeout(() => messageDiv.classList.add('hidden'), 4000);
    }

    async function loadUserData() {
        try {
            const res = await fetch('/api/user/me', { headers: { [csrfHeader]: csrfToken } });
            if (!res.ok) throw new Error(`HTTP ${res.status} - ${await res.text()}`);
            const user = await res.json();

            document.getElementById('nameInput').value = user.name || '';
            document.getElementById('emailInput').value = user.email;
            document.getElementById('goalSelect').value = user.financialGoal || 'BALANCED';
            document.getElementById('incomeInput').value = user.monthlyIncome || 0;
            document.getElementById('userName').textContent = user.name || user.email;

            // Avatar no sidebar
            const avatarDiv = document.getElementById('userAvatar');
            if (user.avatarBase64) {
                avatarDiv.style.backgroundImage = `url(data:image/jpeg;base64,${user.avatarBase64})`;
                avatarDiv.style.backgroundSize = 'cover';
                avatarDiv.textContent = '';
            } else {
                avatarDiv.textContent = (user.name ? user.name.charAt(0).toUpperCase() : user.email.charAt(0).toUpperCase());
                avatarDiv.style.backgroundImage = '';
            }

            // Preview do avatar atual
            const preview = document.getElementById('currentAvatarPreview');
            if (user.avatarBase64) {
                preview.innerHTML = `<img src="data:image/jpeg;base64,${user.avatarBase64}" class="w-full h-full object-cover">`;
            } else {
                const initial = (user.name ? user.name.charAt(0) : user.email.charAt(0)).toUpperCase();
                preview.innerHTML = `<span class="text-gray-500 dark:text-gray-400 text-3xl">${initial}</span>`;
            }
        } catch (err) {
            console.error('loadUserData error:', err);
            showMessage('Erro ao carregar dados: ' + err.message, 'error');
        }
    }

    document.getElementById('profileForm').onsubmit = async (e) => {
        e.preventDefault();
        const payload = {
            name: document.getElementById('nameInput').value,
            email: document.getElementById('emailInput').value,
            financialGoal: document.getElementById('goalSelect').value,
            monthlyIncome: parseFloat(document.getElementById('incomeInput').value) || 0
        };
        try {
            const res = await fetch('/api/user/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
                body: JSON.stringify(payload)
            });
            if (!res.ok) {
                const text = await res.text();
                throw new Error(text || 'Falha ao atualizar perfil');
            }
            showMessage('Perfil atualizado com sucesso!', 'success');
            await loadUserData();
        } catch (err) {
            console.error('updateProfile error:', err);
            showMessage(err.message, 'error');
        }
    };

    document.getElementById('passwordForm').onsubmit = async (e) => {
        e.preventDefault();
        const payload = {
            currentPassword: document.getElementById('currentPassword').value,
            newPassword: document.getElementById('newPassword').value,
            confirmNewPassword: document.getElementById('confirmPassword').value
        };
        try {
            const res = await fetch('/api/user/password', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
                body: JSON.stringify(payload)
            });
            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.message || 'Erro ao alterar senha');
            }
            showMessage('Senha alterada com sucesso!', 'success');
            document.getElementById('passwordForm').reset();
        } catch (err) {
            console.error('changePassword error:', err);
            showMessage(err.message, 'error');
        }
    };

    // Cropper logic (compatível com dark mode)
    const fileInput = document.getElementById('avatarFile');
    const cropperImage = document.getElementById('cropperImage');
    const cropperControls = document.getElementById('cropperControls');

    fileInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) return;
        if (cropper) { cropper.destroy(); cropper = null; }
        const reader = new FileReader();
        reader.onload = (e) => {
            cropperImage.src = e.target.result;
            cropperImage.style.display = 'block';
            cropperControls.style.display = 'flex';
            cropper = new Cropper(cropperImage, {
                aspectRatio: 1,
                viewMode: 1,
                autoCropArea: 1,
                dragMode: 'move',
                cropBoxMovable: true,
                cropBoxResizable: true,
                zoomable: true,
                scalable: true,
                background: false,
                minCropBoxWidth: 100,
                minCropBoxHeight: 100,
            });
        };
        reader.readAsDataURL(file);
    });

    document.getElementById('rotateLeftBtn').onclick = () => cropper?.rotate(-90);
    document.getElementById('zoomOutBtn').onclick = () => cropper?.zoom(-0.1);
    document.getElementById('zoomInBtn').onclick = () => cropper?.zoom(0.1);

    document.getElementById('cropAndUploadBtn').onclick = async () => {
        if (!cropper) { showMessage('Selecione uma imagem primeiro', 'error'); return; }
        const canvas = cropper.getCroppedCanvas({ width: 400, height: 400, imageSmoothingQuality: 'high' });
        if (!canvas) { showMessage('Erro ao processar imagem', 'error'); return; }
        canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append('file', blob, 'avatar.jpg');
            try {
                const res = await fetch('/api/user/avatar', {
                    method: 'POST',
                    headers: { [csrfHeader]: csrfToken },
                    body: formData
                });
                if (!res.ok) throw new Error('Falha no upload');
                showMessage('Avatar atualizado com sucesso!', 'success');
                await loadUserData();
                if (cropper) { cropper.destroy(); cropper = null; }
                cropperImage.style.display = 'none';
                cropperControls.style.display = 'none';
                fileInput.value = '';
            } catch (err) {
                console.error('uploadAvatar error:', err);
                showMessage(err.message, 'error');
            }
        }, 'image/jpeg', 0.95);
    };

    loadUserData();
</script>
</body>
</html>
